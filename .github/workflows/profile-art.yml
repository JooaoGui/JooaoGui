# Gera a cobrinha das contribuições (tema roxo, combinando com o banner do Gengar) uma vez por dia.
name: profile-art

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/profile-art.yml"]

jobs:
  snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#6a3fb8&color_dots=#ebedf0,#dccbf7,#b99aee,#8f68d9,#6a3fb8
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#b58cff&color_dots=#161b22,#33224f,#4f3480,#7350b8,#a47cf0

      - uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
